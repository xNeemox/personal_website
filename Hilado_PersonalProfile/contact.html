<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="contact-style.css">
</head>
<body>
    <main class="main-container">
        <div class="container">
            <div class="text-container">
                <h1>Get in Touch</h2>
                <h3>I'd like to hear from you!</h4>
                <article> If you have any inquiries or just want to
                    say hi, please use the contact form!
                </article>
                <div class="email-part">
                    <img class="icons" src="icons/email.png" alt="">
                    <span>jonathanhilado12@gmail.com</span>
                </div>
                <div class="other-contacts">
                    <a href="https://blogs.mtdv.me/blog/posts/QW3ueUMvWE">
                        <img class="icons" src="icons/github.png" alt="">
                    </a>
                    <a href="https://www.facebook.com/jonathan.hilado.923">
                        <img class="icons" src="icons/facebook.png" alt="">
                    </a>
                    <a href="https://r.mtdv.me/watch?v=fv9j914Duw">
                        <img class="icons" src="icons/instagram.png" alt="">
                    </a>
                    <a href="https://r.mtdv.me/watch?v=DyCuS75dq7">
                        <img class="icons" src="icons/tiktok.png" alt="">
                    </a>
                    <a href="https://r.mtdv.me/watch?v=DyCuS75dq7">
                        <img class="icons" src="icons/twitter.png" alt="">
                    </a>
                </div>
            </div>
            <div class="fill-up">
                <div class="input-title">
                    <label for="first-name">First Name</label>
                    <label for="last-name">Last name</label>
                </div>
                <div class="name-box">
                    <input type="text" id="first-name" name="first-name" >  
                    <input type="text" id="last-name" name="last-name">
                </div>
                <label for="email">Email*</label>
                <input type="text" id="email" name="email">
                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
